<!doctype html>
<!-- Live engine page (fallback dashboard). AI-assisted: Claude Code (Anthropic, Claude Opus 5.5), reviewed/modified by Harshil. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crisis Dispatch Engine</title>
<style>
  :root { --hi:#c62828; --lo:#1565c0; --ink:#1b1b1b; --muted:#666; --bg:#f6f7f9; --card:#fff; }
  body { font: 14px system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
  header { background: #13294b; color: #fff; padding: 10px 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  header b { font-size: 16px; margin-right: auto; }
  button, select, input { font: inherit; padding: 4px 8px; }
  main { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; padding: 12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--card); border-radius: 8px; padding: 10px 12px; box-shadow: 0 1px 2px #0002; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 4px 6px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
  .bar { display: flex; height: 10px; width: 160px; background: #eee; border-radius: 3px; overflow: hidden; }
  .bar span:nth-child(odd) { background: var(--hi); } .bar span:nth-child(even) { background: var(--lo); }
  #feed { height: 360px; overflow: auto; font: 12px ui-monospace, monospace; }
  #feed div { border-bottom: 1px solid #f0f0f0; padding: 2px 0; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <b>Crisis Dispatch Engine</b>
  <span id="clock" class="muted"></span>
  <button onclick="post('/sim/start',{speed:+speed.value})">&#9654; Start</button>
  <button onclick="post('/sim/pause')">&#10074;&#10074; Pause</button>
  <button onclick="post('/sim/step',{minutes:5})">+5 min</button>
  <label>Speed <input id="speed" type="number" value="2" min="1" max="60" style="width:4em"></label>
  <select id="policy" onchange="post('/policy',{preset:this.value})">
    <option>balanced</option><option>deadline_first</option><option>max_people</option><option>equity</option>
  </select>
  <input id="road" placeholder="road id" style="width:6em"><button onclick="post('/roads/'+road.value+'/close')">Close road</button>
  <button onclick="post('/roads/'+road.value+'/reopen')">Reopen</button>
  <input id="veh" placeholder="vehicle" style="width:6em"><button onclick="post('/vehicles/'+veh.value+'/breakdown')">Breakdown</button>
</header>
<main>
  <section><h2>Crisis queue (highest priority first) &mdash; bar = why this rank (S P F C D W)</h2>
    <table><thead><tr><th>#</th><th>Ticket</th><th>Site</th><th>Status</th><th>Score</th><th>Why</th><th>Delivered</th><th>Flags</th></tr></thead>
    <tbody id="queue"></tbody></table>
    <h2 style="margin-top:12px">Vehicles</h2><table><tbody id="vehicles"></tbody></table>
    <h2 style="margin-top:12px">Suppliers (stock / reserved)</h2><table><tbody id="suppliers"></tbody></table>
  </section>
  <section><h2>Live events (WebSocket)</h2><div id="feed"></div><p id="err" class="muted"></p></section>
</main>
<script>
const $ = id => document.getElementById(id);
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  if (!r.ok) { $('err').textContent = url + ': ' + (await r.text()); }
  refresh();
}
async function refresh() {
  const s = await (await fetch('/state')).json();
  $('clock').textContent = `${s.dataset_id} | t+${s.sim.elapsed_min.toFixed(0)} min | ${s.sim.running ? 'running' : 'paused'} | closed roads: ${s.closed_roads.join(', ') || 'none'}`;
  const byId = Object.fromEntries(s.tickets.map(t => [t.ticket_id, t]));
  const ranked = s.ranking.map(id => byId[id]).concat(s.tickets.filter(t => !s.ranking.includes(t.ticket_id)));
  $('queue').innerHTML = ranked.map((t, i) => {
    const b = t.breakdown || {}; const bar = ['S','P','F','C','D','W'].map(k => `<span title="${k} ${(b[k]||0).toFixed(1)}" style="width:${(b[k]||0)*1.6}px"></span>`).join('');
    return `<tr><td>${s.ranking.includes(t.ticket_id) ? i + 1 : '-'}</td><td>${t.ticket_id}${t.refrigerated ? ' (cold)' : ''}</td><td>${t.req_id}</td><td>${t.status}</td>
      <td>${t.priority_score?.toFixed(1) ?? ''}</td><td><div class="bar">${bar}</div></td><td>${t.delivered}/${t.servings_requested}</td><td>${t.flags.join(', ')}</td></tr>`;
  }).join('');
  $('vehicles').innerHTML = s.vehicles.map(v => `<tr><td>${v.vehicle_id}</td><td>${v.refrigerated ? 'reefer' : 'truck'}</td><td>${v.status}</td><td>node ${v.current_node}</td><td>fuel ${v.fuel.toFixed(0)}%</td></tr>`).join('');
  $('suppliers').innerHTML = s.suppliers.map(p => `<tr><td>${p.supp_id}</td><td>${p.name}</td><td>normal ${p.normal_stock}/${p.reserved_normal}</td><td>cold ${p.cold_stock}/${p.reserved_cold}</td></tr>`).join('');
}
const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
ws.onmessage = m => {
  const e = JSON.parse(m.data);
  if (e.type === 'vehicle-moved') return;
  const d = document.createElement('div');
  d.textContent = `${e.ts.slice(11, 16)} ${e.type} ${JSON.stringify(e.data)}`;
  $('feed').prepend(d);
  refresh();
};
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
